<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover so the scene runs under the notch and home indicator;
      user-scalable=no because pinch-zooming a 3D canvas is never what you meant.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wizard's Chess</title>
    <style>
      html, body {
        margin: 0; padding: 0; background: #000; height: 100%;
        overflow: hidden; overscroll-behavior: none;
      }
      /* Touch hygiene: no scroll-bounce, no double-tap zoom, no tap flash, no text
         selection when a drag starts on the board. */
      body {
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas { display: block; touch-action: none; }
      #hud {
        position: fixed; left: 0; right: 0; bottom: 0;
        padding: 10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom))
                 calc(14px + env(safe-area-inset-left));
        font: 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
        color: #d8c3a2; background: linear-gradient(transparent, rgba(0,0,0,.75));
        pointer-events: none; text-shadow: 0 1px 3px #000; letter-spacing: .02em;
      }
      #hud.hidden { display: none; }
      /* Portrait on a phone shows a very small slice of a 2.39:1 frame. Ask for landscape. */
      #rotate {
        position: fixed; inset: 0; display: none; place-items: center; text-align: center;
        background: #000; color: #d8c3a2; z-index: 10; padding: 32px;
        font: 15px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
      }
      @media (max-width: 820px) and (orientation: portrait) {
        #rotate { display: grid; }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <div id="rotate">Turn your device sideways.<br />The chamber is a widescreen room.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
